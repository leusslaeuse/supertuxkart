name: Maintain fork

permissions:
  contents: write

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

concurrency:
  group: maintain-fork
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: nixos
    uses: forks/workflow/.forgejo/workflows/maintain.yml@main
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
