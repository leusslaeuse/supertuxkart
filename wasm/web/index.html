<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SuperTuxKart</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="/game/supertuxkart.js"></script>
    <script>
      // Pause main until the asset download and persistent filesystem are ready.
      globalThis.ready = false;
      var real_run = run;
      run = () => {
        if (globalThis.ready) real_run();
        globalThis.ready = true;
      };
    </script>
    <script src="/script.js" type="module"></script>
    <style>
      body { margin: 0; background: #000; color: #fff; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #info_container {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #000;
        font: 16px/1.5 Arial, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" aria-label="SuperTuxKart"></canvas>
    <div id="info_container">
      <p id="status_text" role="status">Loading game code...</p>
    </div>
    <noscript>SuperTuxKart requires JavaScript to play.</noscript>
  </body>
</html>
